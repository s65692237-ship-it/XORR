<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blood Horror: Ultimate</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #000; color: #ccc;
  font-family: 'Courier New', monospace;
  overflow: hidden; height: 100vh; width: 100vw;
  touch-action: manipulation;
}
#game { position: relative; width: 100vw; height: 100vh; background: #050505; overflow: hidden; }

/* Слои графики */
#scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
#darkness-mask { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#weather { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
#fog { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(circle, transparent 30%, rgba(100,0,0,0.15) 100%); animation: fogPulse 4s infinite alternate; }
@keyframes fogPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
#vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%); }
#blood-overlay { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 6; }
#blood-overlay.active { opacity: 1; }

/* Интерфейс (Текст и Кнопки) */
#ui {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 15px; z-index: 50;
  background: linear-gradient(transparent, rgba(0,0,0,0.95) 30%, #000);
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 35vh; max-height: 70vh;
  pointer-events: none;
}
#text-box { 
  font-size: 18px; line-height: 1.5; margin-bottom: 15px; min-height: 50px; 
  text-shadow: 0 0 6px #000, 0 0 3px #000; pointer-events: auto; color: #e0e0e0;
  word-wrap: break-word;
}
#choices { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; }
.choice-btn {
  background: rgba(40, 0, 0, 0.95); border: 1px solid #7a0000; color: #fff;
  padding: 14px 16px; text-align: left; cursor: pointer;
  font-family: inherit; font-size: 16px; font-weight: bold;
  transition: all 0.1s; border-radius: 6px; width: 100%;
}
.choice-btn:hover { background: rgba(80, 0, 0, 1); border-color: #f00; box-shadow: 0 0 10px rgba(255,0,0,0.5); transform: translateX(5px); }
.choice-btn:active { background: #a00; transform: scale(0.98); }

/* Верхний HUD */
#top-hud {
  position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 60; flex-wrap: wrap; gap: 10px;
}
#stats, #minimap-box { display: flex; gap: 6px; font-size: 13px; flex-wrap: wrap; text-shadow: 0 0 4px #000; pointer-events: auto; }
.stat-badge { background: rgba(20,0,0,0.9); padding: 5px 8px; border-radius: 4px; border: 1px solid #5a0000; color: #fff; display: flex; align-items: center; gap: 4px; }
#minimap-box { background: rgba(0,0,0,0.9); border: 1px solid #333; padding: 5px 8px; font-size: 12px; color: #aaa; flex-direction: column; text-align: right; }

/* Эффекты */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 150; }
#flash.active { opacity: 1; }
#shake { position: fixed; inset: 0; pointer-events: none; z-index: 49; }
#shake.active { animation: shake 0.3s infinite; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,3px); } 50% { transform: translate(3px,-4px); } 75% { transform: translate(-3px,-2px); } }

#notify {
  position: fixed; top: 80px; right: 10px;
  background: rgba(60,0,0,0.95); border: 1px solid #a00;
  padding: 10px 16px; color: #fff; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
  max-width: 80vw; border-radius: 6px; z-index: 120;
}
#notify.active { opacity: 1; }

/* Кнопки для телефона и ПК */
#touch-controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 70; }
#touch-controls button {
  background: rgba(60,0,0,0.9); border: 2px solid #a00; color: #fff;
  width: 60px; height: 60px; border-radius: 50%; font-size: 20px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.8); transition: 0.2s;
}
#touch-controls button:hover { background: #a00; }
#touch-controls button span { font-size: 9px; margin-top: 2px; }

/* МЕНЮ ПАУЗЫ (САМЫЙ ВЕРХНИЙ СЛОЙ) */
#menu-overlay {
  position: fixed; inset: 0; 
  background: rgba(5, 0, 0, 0.98);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  z-index: 500; padding: 20px; overflow-y: auto;
}
#menu-overlay.active { display: flex; }
#menu-overlay h2 { color: #f00; font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 15px #f00; text-align: center; }
#menu-overlay button {
  background: #1a0000; border: 1px solid #5a0000; color: #ccc;
  padding: 14px 32px; cursor: pointer; font-family: inherit; font-size: 16px;
  width: 100%; max-width: 300px; border-radius: 6px; transition: background 0.2s; 
}
#menu-overlay button:hover { background: #3a0000; color: #fff; border-color: #a00; }
#menu-overlay button:active { background: #500; }

/* Элементы внутри меню */
#menu-content { width: 100%; display: flex; flex-direction: column; align-items: center; }
#inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
.inv-item { background: rgba(40,0,0,0.5); border: 1px solid #5a0000; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; color: #f88; cursor: pointer; transition: 0.2s; }
.inv-item:hover { background: rgba(80,0,0,0.7); border-color: #f00; }
.inv-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
#journal-list, #ach-list { width: 100%; max-width: 500px; text-align: left; margin-bottom: 20px; color: #bbb; max-height: 40vh; overflow-y: auto; padding-right: 5px; }
.journal-item, .ach-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
.journal-item b { color: #f44; font-size: 16px; }
.ach-item.unlocked { color: #8f8; }

/* Для ПК */
@media (min-width: 769px) {
  #ui { padding: 20px 50px; min-height: 30vh; }
  #text-box { font-size: 20px; }
  .choice-btn { max-width: 600px; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="darkness-mask"></div>
  <canvas id="weather"></canvas>
  <div id="fog"></div>
  <div id="vignette"></div>
  <div id="blood-overlay"></div>
  <div id="shake"></div>
  
  <div id="top-hud">
    <div id="stats">
      <span class="stat-badge">❤️ <span id="hp">100</span></span>
      <span class="stat-badge">🧠 <span id="sanity">100</span></span>
      <span class="stat-badge">🔋 <span id="battery">100</span></span>
      <span class="stat-badge">⚡ <span id="stamina">100</span></span>
      <span class="stat-badge">⚖️ <span id="karma">0</span></span>
      <span class="stat-badge">🎒 <span id="inv-count">0</span></span>
    </div>
    <div id="minimap-box">
      <span>🗺️ Карта:</span>
      <span id="minimap-loc">Комната</span>
    </div>
  </div>

  <div id="ui">
    <div id="text-box">Загрузка...</div>
    <div id="choices"></div>
  </div>

  <div id="touch-controls">
    <button onclick="togglePauseMenu()">☰<span>МЕНЮ</span></button>
    <button onclick="useFlashlight()">🔦<span>СВЕТ</span></button>
    <button onclick="useWeapon()">🔪<span>НОЖ</span></button>
  </div>

  <div id="flash"></div>
  <div id="notify"></div>
  
  <div id="menu-overlay">
    <h2 id="menu-title">ПАУЗА</h2>
    <div id="menu-content"></div>
  </div>
</div>

<script>
// ========== СОСТОЯНИЕ ==========
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const weatherCanvas = document.getElementById('weather');
const wctx = weatherCanvas.getContext('2d');
const darkCanvas = document.getElementById('darkness-mask');
const dctx = darkCanvas.getContext('2d');
const textBox = document.getElementById('text-box');
const choicesBox = document.getElementById('choices');
const menuOverlay = document.getElementById('menu-overlay');
const menuTitle = document.getElementById('menu-title');
const menuContent = document.getElementById('menu-content');

let state = { 
  scene: 'start', hp: 100, paused: false, battery: 100, flashlightOn: false, stamina: 100,
  difficulty: 'normal', weaponDurability: 3, karma: 0, location: 'Комната', currentFloor: 1,
  endlessMode: false, endlessScore: 0, endlessWave: 1, speedrunMode: false, speedrunTime: 0, colorblind: false
};
let soundOn = true, typeSpeed = 25;
let drawInterval = null;

function resize() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  darkCanvas.width = innerWidth; darkCanvas.height = innerHeight;
  weatherCanvas.width = innerWidth; weatherCanvas.height = innerHeight;
}
window.addEventListener('resize', resize); resize();

function notify(msg) {
  const n = document.getElementById('notify');
  n.textContent = msg; n.classList.add('active');
  setTimeout(() => n.classList.remove('active'), 2500);
  if (navigator.vibrate) navigator.vibrate(50);
}

// ========== ЗВУК ==========
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audio = {
  tone(freq, dur, type='sine', vol=0.1) {
    if (!soundOn) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(audioCtx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  },
  drip() { this.tone(800, 0.15, 'sine', 0.08); },
  creak() { this.tone(120, 0.6, 'sawtooth', 0.06); },
  scream() { this.tone(400, 0.8, 'sawtooth', 0.15); setTimeout(() => this.tone(300, 0.6, 'square', 0.1), 100); },
  heartbeat() { this.tone(60, 0.15, 'sine', 0.2); setTimeout(() => this.tone(50, 0.15, 'sine', 0.15), 200); },
  ambient() { 
    if (!soundOn) return;
    const theme = state.scene === 'basement' ? 45 : state.scene === 'corridor' ? 55 : 40;
    this.tone(theme, 4, 'sine', 0.02); 
    setTimeout(() => this.ambient(), 4000); 
  },
  pickup() { this.tone(600, 0.1, 'sine', 0.15); setTimeout(() => this.tone(900, 0.15, 'sine', 0.1), 80); },
  unlock() { this.tone(400, 0.1, 'square', 0.1); setTimeout(() => this.tone(600, 0.2, 'square', 0.1), 100); },
  echo() { this.tone(200, 0.4, 'sawtooth', 0.08); setTimeout(() => this.tone(180, 0.4, 'sawtooth', 0.06), 200); },
  hit() { this.tone(150, 0.2, 'square', 0.15); },
  victory() { this.tone(400, 0.2, 'sine', 0.1); setTimeout(() => this.tone(600, 0.2, 'sine', 0.1), 200); setTimeout(() => this.tone(800, 0.4, 'sine', 0.1), 400); }
};

// ========== КРОВЬ / ЭФФЕКТЫ ==========
const gore = {
  particles: [], puddles: [],
  spawn(x, y, count=20) {
    for (let i=0;i<count;i++) this.particles.push({ x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10-2, life:60+Math.random()*40, size:2+Math.random()*5 });
  },
  addPuddle(x, y, r=40) { this.puddles.push({x, y, r, alpha:0.8}); },
  clear() { this.particles = []; this.puddles = []; },
  update() {
    this.particles = this.particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--; return p.life>0; });
  },
  draw() {
    this.puddles.forEach(p => { ctx.fillStyle = `rgba(150,0,0,${p.alpha})`; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r*0.3, 0, 0, Math.PI*2); ctx.fill(); });
    this.particles.forEach(p => { ctx.fillStyle = `rgba(220,0,0,${Math.min(1, p.life/60)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
  }
};

const flash = {
  trigger(color='#fff') { const f = document.getElementById('flash'); f.style.background = color; f.classList.add('active'); setTimeout(() => f.classList.remove('active'), 100); }
};

// ========== ПОГОДА ==========
const weather = {
  rainDrops: [],
  update() {
    if (state.location === 'Крыша' || state.scene === 'roof') {
      if (this.rainDrops.length < 100) this.rainDrops.push({x: Math.random()*innerWidth, y: 0, speed: 10+Math.random()*10});
      this.rainDrops.forEach((d, i) => { d.y += d.speed; if (d.y > innerHeight) this.rainDrops.splice(i, 1); });
    } else {
      this.rainDrops = [];
    }
    wctx.clearRect(0,0,innerWidth,innerHeight);
    wctx.strokeStyle = 'rgba(150,150,255,0.4)';
    wctx.lineWidth = 1;
    this.rainDrops.forEach(d => { wctx.beginPath(); wctx.moveTo(d.x, d.y); wctx.lineTo(d.x, d.y+15); wctx.stroke(); });
  }
};

// ========== СТАТЫ ==========
const sanity = {
  value: 100,
  set(v) {
    this.value = Math.max(0, Math.min(100, v));
    document.getElementById('sanity').textContent = this.value;
    const s = document.getElementById('shake');
    if (this.value < 40) document.body.style.filter = state.colorblind ? 'contrast(1.5)' : `hue-rotate(${(40-this.value)*3}deg)`;
    else document.body.style.filter = state.colorblind ? 'contrast(1.5)' : '';
    s.classList.toggle('active', this.value < 30);
  },
  decrease(n) { this.set(this.value - n); },
  increase(n) { this.set(this.value + n); }
};

const staminaSys = {
  value: 100,
  drain(n) {
    this.value = Math.max(0, this.value - n);
    document.getElementById('stamina').textContent = Math.floor(this.value);
  },
  regen() {
    if (this.value < 100) {
      this.value = Math.min(100, this.value + 0.2);
      document.getElementById('stamina').textContent = Math.floor(this.value);
    }
  }
};

const batterySystem = {
  drain() {
    if (!state.flashlightOn) return;
    state.battery = Math.max(0, state.battery - 0.05);
    document.getElementById('battery').textContent = Math.floor(state.battery);
    if (state.battery <= 0) { state.flashlightOn = false; notify('Фонарик сел'); }
  }
};

const karma = {
  value: 0,
  add(n) { this.value += n; document.getElementById('karma').textContent = this.value; }
};

function useFlashlight() { if(state.paused) return; state.flashlightOn = !state.flashlightOn; notify(state.flashlightOn ? 'Фонарик ВКЛ' : 'Фонарик ВЫКЛ'); }

function updateBloodOverlay() {
  const b = document.getElementById('blood-overlay');
  if (state.hp < 40) {
    b.classList.add('active');
    b.style.background = `radial-gradient(circle, transparent 20%, rgba(150,0,0,${(40-state.hp)/60}) 100%)`;
  } else b.classList.remove('active');
}

// ========== ИНВЕНТАРЬ ==========
const inventory = {
  items: [],
  add(item) { if(!this.items.includes(item)){ this.items.push(item); document.getElementById('inv-count').textContent = this.items.length; notify('🎒 ' + item); audio.pickup(); } },
  has(item) { return this.items.includes(item); },
  remove(item) { this.items = this.items.filter(i=>i!==item); document.getElementById('inv-count').textContent = this.items.length; },
  craft(a, b, result) { if (this.has(a) && this.has(b)) { this.remove(a); this.remove(b); this.add(result); return true; } return false; }
};

// ========== ОРУЖИЕ ==========
function useWeapon() {
  if(state.paused) return;
  let weapon = inventory.has('топор') ? 'топор' : inventory.has('труба') ? 'труба' : inventory.has('нож') ? 'нож' : null;
  if (!weapon) { notify('Нет оружия'); return; }
  if (staminaSys.value < 20) { notify('Нет сил для удара!'); return; }
  
  staminaSys.drain(20);
  state.weaponDurability--;
  audio.hit(); 
  notify(`Удар ${weapon}! Прочность: ${state.weaponDurability}`);
  
  if (state.weaponDurability <= 0) { notify('Оружие сломалось!'); inventory.remove(weapon); }
  if (enemy.active) { enemy.stop(); notify('Враг отступил!'); }
}

// ========== ВРАГИ ==========
let enemyMultiplier = 1;
const enemy = {
  active: false, timer: 0,
  start(sec=30) { this.active=true; this.timer=sec/enemyMultiplier; },
  stop() { this.active=false; this.timer=0; },
  update(dt) {
    if (!this.active) return;
    this.timer -= dt;
    if (this.timer <= 0) { this.active=false; this.onCatch(); }
    else if (this.timer < 10 && Math.random() < 0.05) audio.heartbeat();
  },
  onCatch() {
    flash.trigger('#ff0000'); audio.scream();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    sanity.decrease(30); state.hp -= 40;
    document.getElementById('hp').textContent = Math.max(0, state.hp);
    stats.deaths++; saveGame();
    goTo(state.hp <= 0 ? 'death' : 'caught');
  }
};

const echo = {
  active: false, timer: null, messages: ['обернись','я здесь','не отвечай'],
  start() { this.active = true; this.tick(); },
  stop() { this.active = false; clearTimeout(this.timer); },
  tick() {
    if (!this.active) return;
    notify('ЭХО: ' + this.messages[Math.floor(Math.random()*this.messages.length)]); audio.echo();
    sanity.decrease(5);
    this.timer = setTimeout(() => this.tick(), 8000);
  }
};

// ========== ТЕКСТ / ДНЕВНИК ==========
const typewriter = {
  timer: null,
  write(text, cb) {
    clearInterval(this.timer); textBox.textContent = ''; let i = 0;
    this.timer = setInterval(() => {
      textBox.textContent += text[i] || '';
      if (++i >= text.length) { clearInterval(this.timer); if(cb) cb(); }
    }, typeSpeed);
  }
};

const journal = {
  notes: [],
  add(title, text) { if(!this.notes.find(n=>n.title===title)){ this.notes.push({title, text}); notify('📜 ' + title); } }
};

const achievements = {
  unlocked: [],
  defs: { 'first_death': 'Смерть', 'escape': 'Сбежал', 'caught': 'Пойман', 'true_ending': 'Истина', 'no_damage': 'Без урона', 'crafter': 'Крафтер', 'journalist': 'Архивист', 'night_owl': 'Ночной житель', 'speedrunner': 'Спидраннер', 'endless_10': 'Кошмар 10 волн' },
  unlock(id) { if (!this.unlocked.includes(id) && this.defs[id]) { this.unlocked.push(id); notify('🏆 ' + this.defs[id]); audio.pickup(); } }
};

const stats = { deaths: 0, endings: [], playtime: 0,
  render() { document.getElementById('minimap-loc').textContent = state.location; }
};
setInterval(() => {
  if(state.paused) return;
  stats.playtime++;
  if (state.speedrunMode) state.speedrunTime++;
  if (stats.playtime >= 300) achievements.unlock('night_owl');
  if (journal.notes.length >= 6) achievements.unlock('journalist');
}, 1000);

// ========== СОХРАНЕНИЕ ==========
const save = {
  key: 'bloodhorror_ultimate_v13',
  save() {
    localStorage.setItem(this.key, JSON.stringify({
      scene: state.scene, hp: state.hp, battery: state.battery, stamina: staminaSys.value, difficulty: state.difficulty,
      weaponDurability: state.weaponDurability, karma: karma.value, endlessScore: state.endlessScore,
      sanity: sanity.value, inv: inventory.items, location: state.location, floor: state.currentFloor,
      stats: { deaths: stats.deaths, endings: stats.endings, playtime: stats.playtime },
      sound: soundOn, typeSpeed, colorblind: state.colorblind,
      journal: journal.notes, achievements: achievements.unlocked
    }));
  },
  load() { const d = localStorage.getItem(this.key); return d ? JSON.parse(d) : null; },
  clear() { localStorage.removeItem(this.key); },
  exists() { return this.load() !== null; }
};
function saveGame() { save.save(); notify('💾 Сохранено'); }
function loadState(d) {
  state.scene = d.scene || 'start'; state.hp = d.hp || 100; state.battery = d.battery ?? 100; staminaSys.value = d.stamina ?? 100;
  state.difficulty = d.difficulty || 'normal'; state.weaponDurability = d.weaponDurability ?? 3;
  state.endlessScore = d.endlessScore || 0; karma.value = d.karma || 0;
  state.location = d.location || 'Комната'; state.currentFloor = d.floor || 1;
  state.colorblind = d.colorblind || false;
  sanity.set(d.sanity ?? 100); inventory.items = d.inv || []; document.getElementById('inv-count').textContent = inventory.items.length;
  if (d.stats) { stats.deaths = d.stats.deaths || 0; stats.endings = d.stats.endings || []; stats.playtime = d.stats.playtime || 0; }
  soundOn = d.sound ?? true; typeSpeed = d.typeSpeed ?? 25;
  journal.notes = d.journal || []; achievements.unlocked = d.achievements || [];
  document.getElementById('hp').textContent = state.hp;
  document.getElementById('battery').textContent = Math.floor(state.battery);
  document.getElementById('stamina').textContent = Math.floor(staminaSys.value);
  document.getElementById('karma').textContent = karma.value;
  updateEnemyMultiplier();
}

function startNewGame() {
  save.clear();
  state.hp = 100; state.battery = 100; staminaSys.value = 100; state.karma = 0; karma.value = 0;
  sanity.set(100); inventory.items = []; document.getElementById('inv-count').textContent = 0;
  stats.deaths = 0; stats.endings = []; stats.playtime = 0; journal.notes = [];
  closeMenu();
  goTo('start');
}

function updateEnemyMultiplier() {
  enemyMultiplier = state.difficulty === 'easy' ? 0.6 : state.difficulty === 'hard' ? 1.8 : 1;
}

// ========== МЕНЮ ==========
function closeMenu() { 
  menuOverlay.classList.remove('active'); 
  state.paused = false; 
}

function renderMenu(type) {
  menuOverlay.classList.add('active'); 
  menuContent.innerHTML = '';

  if (type === 'pause') {
    menuTitle.textContent = 'ПАУЗА';
    menuContent.innerHTML = `
      <button onclick="closeMenu()">Продолжить</button>
      <button onclick="saveGame()">Сохранить</button>
      <button onclick="renderMenu('inventory')">Инвентарь</button>
      <button onclick="renderMenu('journal')">Дневник</button>
      <button onclick="renderMenu('settings')">Настройки</button>
      <button onclick="startNewGame()" style="color:#f44; margin-top:20px;">Начать заново</button>
    `;
  } 
  else if (type === 'inventory') {
    menuTitle.textContent = 'ИНВЕНТАРЬ';
    const grid = document.createElement('div'); grid.id = 'inventory-grid';
    inventory.items.forEach(item => {
      const div = document.createElement('div'); div.className = 'inv-item'; div.textContent = item;
      div.onclick = () => { useItem(item); renderMenu('inventory'); }; grid.appendChild(div);
    });
    if(inventory.items.length === 0) grid.innerHTML = '<p style="color:#666; width:100%; text-align:center;">Пусто</p>';
    menuContent.appendChild(grid);
    menuContent.innerHTML += `<div class="inv-actions"><button onclick="renderMenu('craft')">Крафт</button></div><button onclick="renderMenu('pause')">Назад</button>`;
  } 
  else if (type === 'craft') {
    menuTitle.textContent = 'КРАФТ';
    menuContent.innerHTML = `<div style="text-align:left; color:#aaa; margin-bottom:20px; max-width:300px;"><p>Бинт + Таблетки = Аптечка</p><p>Нож + Камень = Заточенный нож</p></div>
      <button onclick="if(inventory.craft('бинт','таблетки','аптечка')){achievements.unlock('crafter'); renderMenu('inventory');} else notify('Нет')">Создать аптечку</button>
      <button onclick="renderMenu('inventory')">Назад</button>`;
  } 
  else if (type === 'settings') {
    menuTitle.textContent = 'НАСТРОЙКИ';
    menuContent.innerHTML = `
      <button onclick="soundOn=!soundOn; renderMenu('settings')">Звук: ${soundOn ? 'ВКЛ' : 'ВЫКЛ'}</button>
      <button onclick="typeSpeed = typeSpeed===25?50:25; renderMenu('settings')">Скорость текста: ${typeSpeed}мс</button>
      <button onclick="state.colorblind=!state.colorblind; sanity.set(sanity.value); renderMenu('settings')">Дальтонизм: ${state.colorblind ? 'ВКЛ' : 'ВЫКЛ'}</button>
      <button onclick="renderMenu('pause')">Назад</button>
    `;
  } 
  else if (type === 'journal') {
    menuTitle.textContent = 'ДНЕВНИК';
    let html = ''; journal.notes.forEach(n => { html += `<div class="journal-item"><b>${n.title}</b><br>${n.text}</div>`; });
    menuContent.innerHTML = `<div id="journal-list">${html || '<p style="color:#666;">Пусто</p>'}</div><button onclick="renderMenu('pause')">Назад</button>`;
  } 
}

function togglePauseMenu() {
  if (state.paused) closeMenu();
  else { state.paused = true; renderMenu('pause'); }
}

function useItem(item) {
  if (item === 'аптечка') { state.hp = Math.min(100, state.hp + 40); document.getElementById('hp').textContent = state.hp; inventory.remove('аптечка'); notify('+40 HP'); }
  if (item === 'таблетки') { sanity.increase(30); inventory.remove('таблетки'); notify('+30 Рассудок'); }
  if (item === 'бинт') { state.hp = Math.min(100, state.hp + 15); document.getElementById('hp').textContent = state.hp; inventory.remove('бинт'); notify('+15 HP'); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.paused) closeMenu();
    else togglePauseMenu();
  }
});

// ========== СЦЕНЫ / РЕНДЕР ==========
function showText(t) { typewriter.write(t); }
function showChoices(list) { 
  choicesBox.innerHTML = ''; 
  list.forEach(c => { 
    const b = document.createElement('button'); 
    b.className = 'choice-btn'; 
    b.textContent = c.label; 
    b.onclick = c.action; 
    choicesBox.appendChild(b); 
  }); 
}
function clearChoices() { choicesBox.innerHTML = ''; }

function renderBackground(sceneId) {
  if (drawInterval) clearInterval(drawInterval);
  const colors = { start: '#151515', look_around: '#151515', corner: '#2a0a0a', door: '#101520', corridor: '#0a0a10', basement: '#100000', attic: '#151005', morgue: '#050a0a', floor2: '#101015', roof: '#050515', default: '#111', endless: '#200000' };
  const bgCol = colors[sceneId] || colors.default;

  const drawFrame = () => {
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.lineWidth = 2;
    
    // Пол
    ctx.beginPath(); ctx.moveTo(canvas.width * 0.1, canvas.height * 0.7); ctx.lineTo(canvas.width * 0.9, canvas.height * 0.7); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill(); ctx.stroke();

    // Стены
    ctx.beginPath(); ctx.moveTo(canvas.width * 0.1, canvas.height * 0.7); ctx.lineTo(canvas.width * 0.3, canvas.height * 0.3); ctx.lineTo(canvas.width * 0.7, canvas.height * 0.3); ctx.lineTo(canvas.width * 0.9, canvas.height * 0.7); ctx.stroke();

    // Дверь
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(canvas.width * 0.42, canvas.height * 0.4, canvas.width * 0.16, canvas.height * 0.3);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.strokeRect(canvas.width * 0.42, canvas.height * 0.4, canvas.width * 0.16, canvas.height * 0.3);

    gore.draw();

    // Тьма
    dctx.clearRect(0, 0, darkCanvas.width, darkCanvas.height);
    dctx.fillStyle = 'rgba(0,0,0,0.75)'; dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height);
    if (state.flashlightOn) {
      const cx = darkCanvas.width / 2, cy = darkCanvas.height / 2;
      const grad = dctx.createRadialGradient(cx, cy, 100, cx, cy, Math.max(canvas.width, canvas.height) * 0.6);
      grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.75)');
      dctx.globalCompositeOperation = 'destination-out'; dctx.fillStyle = grad;
      dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height); dctx.globalCompositeOperation = 'source-over';
    } else if (['start', 'safe'].includes(sceneId)) {
      dctx.fillStyle = 'rgba(0,0,0,0.3)'; dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height);
    }
    weather.update();
  };
  drawFrame(); drawInterval = setInterval(drawFrame, 33);
}

const scenes = {
  start: () => {
    gore.clear(); renderBackground('start'); state.location = 'Комната 1 этаж';
    showText('Ты просыпаешься. Пахнет кровью. Где-то капает вода.');
    showChoices([
      { label: 'Осмотреться', action: () => goTo('look_around') },
      { label: 'Открыть дверь', action: () => goTo('door') },
      { label: 'Бесконечный кошмар', action: () => { state.endlessMode = true; goTo('endless'); } },
    ]);
  },
  look_around: () => {
    renderBackground('look_around'); state.location = 'Комната 1 этаж';
    gore.addPuddle(canvas.width * 0.3, canvas.height * 0.8, 60);
    showText('На полу — бурые пятна. В углу что-то шевелится.');
    journal.add('Записка 1', '«Не выходи из комнаты.»');
    showChoices([{ label: 'Подойти', action: () => goTo('corner') }, { label: 'Отступить', action: () => goTo('door') }]);
  },
  corner: () => {
    renderBackground('corner'); gore.addPuddle(canvas.width * 0.5, canvas.height * 0.7, 120); gore.spawn(canvas.width * 0.5, canvas.height * 0.6, 40);
    showText('Это тело. Оно ещё тёплое.');
    showChoices([{ label: 'Обыскать', action: () => { inventory.add('ключ'); goTo('door'); } }, { label: 'Уйти', action: () => { sanity.decrease(10); goTo('door'); } }]);
    audio.scream();
  },
  door: () => {
    renderBackground('door'); state.location = 'Дверь';
    showText('Дверь заперта. За ней шаги.');
    showChoices([
      { label: 'Спрятаться', action: () => { enemy.start(10); goTo('hide'); } },
      { label: 'Открыть ключом', action: () => { if (inventory.has('ключ')) goTo('corridor'); else notify('Нужен ключ'); }},
      { label: 'На 2 этаж', action: () => goTo('floor2') },
      { label: 'На крышу', action: () => goTo('roof') },
    ]);
  },
  hide: () => {
    renderBackground('start'); staminaSys.drain(30);
    showText('Ты прячешься. Шаги...');
    showChoices([{ label: 'Ждать', action: () => { enemy.stop(); goTo('safe'); } }]);
  },
  safe: () => {
    renderBackground('start'); state.location = 'Безопасная зона';
    showText('Ты жив. Здесь можно передохнуть. Стамина восстанавливается.');
    staminaSys.value = 100; document.getElementById('stamina').textContent = 100;
    showChoices([
      { label: 'В коридор', action: () => goTo('corridor') },
      { label: 'На 2 этаж', action: () => goTo('floor2') },
      { label: 'На крышу', action: () => goTo('roof') },
    ]);
  },
  corridor: () => {
    renderBackground('corridor'); state.location = 'Коридор';
    showText('Кровавые отпечатки. Плачет ребёнок.');
    showChoices([
      { label: 'В подвал', action: () => { sanity.decrease(15); goTo('basement'); } }, 
      { label: 'Выживший', action: () => goTo('npc') },
      { label: 'Назад', action: () => goTo('safe') },
    ]);
  },
  npc: () => {
    renderBackground('corridor');
    showText('Выживший: "Помоги... У меня есть таблетки".');
    showChoices([
      { label: 'Помочь (Карма +1)', action: () => { karma.add(1); inventory.add('таблетки'); sanity.increase(10); goTo('safe'); } },
      { label: 'Забрать (Карма -1)', action: () => { karma.add(-1); inventory.add('таблетки'); inventory.add('бинт'); sanity.decrease(10); goTo('safe'); } },
      { label: 'Уйти', action: () => goTo('safe') }
    ]);
  },
  basement: () => {
    renderBackground('basement'); state.location = 'Подвал';
    gore.addPuddle(canvas.width * 0.5, canvas.height * 0.85, 150);
    showText('Тела на крюках. Кровь в канаве.');
    inventory.add('бинт'); inventory.add('труба');
    journal.add('Записка 3', '«Подвал — не место для живых.»');
    showChoices([
      { label: 'Взять таблетки', action: () => { inventory.add('таблетки'); goTo('safe'); } },
      { label: 'Поставить ловушку', action: () => { inventory.add('капкан'); notify('Капкан установлен'); goTo('safe'); } },
      { label: 'Спуститься глубже (Босс)', action: () => { enemy.start(5); goTo('boss'); } },
    ]);
  },
  floor2: () => {
    renderBackground('floor2'); state.location = '2 Этаж'; state.currentFloor = 2;
    showText('Второй этаж. Детская комната. Везде игрушки и кровь.');
    journal.add('Записка 7', '«Она была здесь. Она играла с куклой.»');
    showChoices([
      { label: 'Открыть шкаф', action: () => { inventory.add('топор'); notify('Найден топор!'); goTo('floor2'); } },
      { label: 'Вниз', action: () => goTo('safe') },
    ]);
  },
  roof: () => {
    renderBackground('roof'); state.location = 'Крыша';
    showText('Крыша. Идёт дождь. Внизу город.');
    sanity.increase(10);
    showChoices([{ label: 'Вниз', action: () => goTo('safe') }]);
  },
  boss: () => {
    renderBackground('boss'); state.location = '???';
    echo.start();
    showText('Твоя копия улыбается.');
    showChoices([
      { label: 'Убить себя', action: () => { goTo('caught'); } },
      { label: 'Стать Эхом', action: () => { echo.stop(); goTo('ending_echo'); } },
      { label: 'Сбежать', action: () => { echo.stop(); goTo('ending_escape'); } },
      { label: 'Истинная концовка (Нужны все записки)', action: () => { 
          if (journal.notes.length >= 6) { echo.stop(); goTo('ending_true'); } 
          else notify('Ты не знаешь всей правды...'); 
      } },
    ]);
  },
  endless: () => {
    renderBackground('endless'); state.location = 'Кошмар';
    showText(`БЕСКОНЕЧНЫЙ КОШМАР\nВолна: ${state.endlessWave}\nОчки: ${state.endlessScore}`);
    enemy.start(10 - Math.min(8, state.endlessWave));
    showChoices([
      { label: 'Сражаться (Тратит стамину)', action: () => { 
          if (staminaSys.value > 20) {
            staminaSys.drain(20); state.endlessScore += 10; state.endlessWave++; audio.hit(); enemy.stop(); goTo('endless');
          } else { state.hp -= 30; notify('Нет стамины!'); if (state.hp <= 0) goTo('death'); else goTo('endless'); }
      } },
      { label: 'Бежать', action: () => { staminaSys.drain(30); if (Math.random() > 0.5) { state.endlessScore += 5; state.endlessWave++; enemy.stop(); goTo('endless'); } else { enemy.onCatch(); } } },
      { label: 'Выход', action: () => { state.endlessMode = false; goTo('start'); } }
    ]);
  },
  caught: () => {
    renderBackground('corner'); flash.trigger('#ff0000'); gore.spawn(canvas.width/2, canvas.height/2, 100);
    showText('Оно хватает тебя...');
    if (!stats.endings.includes('caught')) stats.endings.push('caught');
    achievements.unlock('caught');
    showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
  },
  death: () => {
    renderBackground('default');
    showText('Ты не выжил.');
    if (!stats.endings.includes('death')) stats.endings.push('death');
    showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
  },
  ending_escape: () => {
    renderBackground('roof'); audio.victory();
    showText('Ты сбежал. Но тень осталась.');
    if (!stats.endings.includes('escape')) stats.endings.push('escape');
    if (state.speedrunMode) achievements.unlock('speedrunner');
    showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
  },
  ending_echo: () => {
    renderBackground('default');
    showText('Ты стал Эхом.');
    showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
  },
  ending_true: () => {
    renderBackground('default'); audio.victory();
    showText('Ты собрал все записки. Ты узнал правду. Это был не сон. Это было чистилище.');
    achievements.unlock('true_ending');
    showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
  }
};

function goTo(name) { if (scenes[name]) { state.scene = name; scenes[name](); save.save(); } }

// ========== ЦИКЛ ==========
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (!state.paused) {
    gore.update();
    enemy.update(dt); 
    batterySystem.drain();
    staminaSys.regen();
    updateBloodOverlay();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ========== СТАРТ ==========
goTo('start');
audio.ambient();
</script>
</body>
</html>
