<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blood Horror: Ultimate - Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #000; color: #ccc;
  font-family: 'Courier New', monospace;
  overflow: hidden; height: 100vh; width: 100vw;
  touch-action: manipulation;
}
#game { position: relative; width: 100vw; height: 100vh; background: #050505; overflow: hidden; }

/* Слои графики */
#scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
#darkness-mask { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; transition: opacity 0.5s; }
#weather { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
#fog { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(circle, transparent 20%, rgba(80,0,0,0.3) 100%); animation: fogPulse 4s infinite alternate; }
@keyframes fogPulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
#vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,1) 100%); }
#blood-overlay { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 6; }
#blood-overlay.active { opacity: 1; }

/* Скример (Jump Scare) */
#jumpscare {
    position: fixed; inset: 0; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="%23000"/><circle cx="50%" cy="50%" r="30%" fill="%23f00"/><circle cx="40%" cy="45%" r="5%" fill="%23000"/><circle cx="60%" cy="45%" r="5%" fill="%23000"/></svg>') center/cover; 
    z-index: 1000; display: none;
}
#jumpscare.active { display: block; animation: scareAnim 0.5s forwards; }
@keyframes scareAnim { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* Эффект телефона */
#phone-ui {
    position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
    width: 300px; height: 60%; background: #000; border: 8px solid #222; border-radius: 20px;
    z-index: 60; display: none; flex-direction: column; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
#phone-ui.active { display: flex; }
#phone-header { background: #111; padding: 10px; text-align: center; font-size: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
#phone-chat { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { background: #222; padding: 8px 12px; border-radius: 10px; font-size: 12px; max-width: 80%; animation: msgPop 0.3s; }
@keyframes msgPop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.chat-msg.them { align-self: flex-start; border-bottom-left-radius: 0; }
.chat-msg.me { align-self: flex-end; background: #600; border-bottom-right-radius: 0; }
.chat-msg.creepy { background: #300; border: 1px solid #f00; color: #f88; font-weight: bold; text-shadow: 0 0 5px #f00; }

/* Экран финала */
#end-screen {
    position: fixed; inset: 0; background: #000; z-index: 2000;
    display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
}
#end-screen.active { display: flex; }
#end-screen h1 { color: #f00; font-size: 36px; text-shadow: 0 0 20px #f00; margin-bottom: 20px; }
#end-screen p { color: #aaa; font-size: 18px; margin-bottom: 30px; max-width: 600px; line-height: 1.5; }
#end-screen button {
    background: #300; border: 2px solid #f00; color: #fff; padding: 15px 40px; font-size: 18px; font-family: inherit; cursor: pointer; transition: 0.3s;
}
#end-screen button:hover { background: #a00; box-shadow: 0 0 20px #f00; }

/* Индикатор перехода */
#transition-text {
  position: absolute; top: 40%; left: 0; right: 0;
  text-align: center; font-size: 40px; font-weight: bold;
  color: #f00; text-shadow: 0 0 20px #f00, 0 0 10px #000;
  opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 100;
  letter-spacing: 5px; text-transform: uppercase;
}
#transition-text.show { opacity: 1; }

/* Интерфейс */
#ui {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 15px; z-index: 70;
  background: linear-gradient(transparent, rgba(0,0,0,0.95) 30%, #000);
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 35vh; max-height: 70vh;
  pointer-events: none;
}
#text-box { 
  font-size: 18px; line-height: 1.5; margin-bottom: 15px; min-height: 50px; 
  text-shadow: 0 0 6px #000, 0 0 3px #000; pointer-events: auto; color: #e0e0e0;
  word-wrap: break-word;
}
#choices { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; }
.choice-btn {
  background: rgba(30, 0, 0, 0.95); border: 1px solid #8a0000; color: #ddd;
  padding: 14px 16px; text-align: left; cursor: pointer;
  font-family: inherit; font-size: 16px; font-weight: bold;
  transition: all 0.2s; border-radius: 6px; width: 100%;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.choice-btn:hover { background: rgba(70, 0, 0, 1); border-color: #f00; color: #fff; box-shadow: 0 0 15px rgba(255,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.8); transform: translateX(5px); }
.choice-btn:active { background: #a00; transform: scale(0.98); }

/* Верхний HUD */
#top-hud {
  position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 80; flex-wrap: wrap; gap: 10px;
}
#stats, #minimap-box { display: flex; gap: 6px; font-size: 13px; flex-wrap: wrap; text-shadow: 0 0 4px #000; pointer-events: auto; }
.stat-badge { background: rgba(15,0,0,0.9); padding: 5px 8px; border-radius: 4px; border: 1px solid #5a0000; color: #fff; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 5px #000; }
#minimap-box { background: rgba(0,0,0,0.9); border: 1px solid #333; padding: 5px 8px; font-size: 12px; color: #aaa; flex-direction: column; text-align: right; }

/* Эффекты */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 150; }
#flash.active { opacity: 1; }
#shake { position: fixed; inset: 0; pointer-events: none; z-index: 49; }
#shake.active { animation: shake 0.3s infinite; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-5px,4px); } 50% { transform: translate(4px,-5px); } 75% { transform: translate(-4px,-3px); } }

#notify {
  position: fixed; top: 80px; right: 10px;
  background: rgba(50,0,0,0.95); border: 1px solid #a00;
  padding: 10px 16px; color: #fff; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
  max-width: 80vw; border-radius: 6px; z-index: 120;
  box-shadow: 0 0 15px rgba(255,0,0,0.3);
}
#notify.active { opacity: 1; }

/* Кнопки управления */
#touch-controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 70; }
#touch-controls button {
  background: rgba(40,0,0,0.9); border: 2px solid #a00; color: #fff;
  width: 60px; height: 60px; border-radius: 50%; font-size: 20px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,0,0,0.2); transition: 0.2s;
}
#touch-controls button:hover { background: #a00; box-shadow: 0 0 20px rgba(255,0,0,0.6); }
#touch-controls button span { font-size: 9px; margin-top: 2px; }

/* МЕНЮ ПАУЗЫ */
#menu-overlay {
  position: fixed; inset: 0; 
  background: rgba(5, 0, 0, 0.98);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  z-index: 500; padding: 20px; overflow-y: auto;
}
#menu-overlay.active { display: flex; }
#menu-overlay h2 { color: #f00; font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 15px #f00; text-align: center; letter-spacing: 3px; }
#menu-overlay button {
  background: #1a0000; border: 1px solid #5a0000; color: #ccc;
  padding: 14px 32px; cursor: pointer; font-family: inherit; font-size: 16px;
  width: 100%; max-width: 300px; border-radius: 6px; transition: all 0.2s; 
  box-shadow: inset 0 0 10px #000;
}
#menu-overlay button:hover { background: #3a0000; color: #fff; border-color: #a00; box-shadow: 0 0 10px #a00, inset 0 0 10px #000; }
#menu-overlay button:active { background: #500; }

/* Фальшивое окно */
#fake-window {
  position: fixed; top: 30%; left: 20%; right: 20%;
  background: #111; border: 2px solid #555; padding: 20px;
  display: none; flex-direction: column; align-items: center; gap: 15px;
  z-index: 800; box-shadow: 0 0 40px rgba(0,0,0,1);
}
#fake-window.active { display: flex; }
#fake-window p { font-size: 18px; text-align: center; color: #fff; margin-bottom: 10px; text-shadow: 0 0 5px #000; }
#fake-window .btn-row { display: flex; gap: 10px; }
#fake-window button { padding: 10px 20px; background: #333; color: #fff; border: 1px solid #666; cursor: pointer; font-family: inherit; font-size: 16px; }
#fake-window button:hover { background: #555; }

/* Элементы внутри меню */
#menu-content { width: 100%; display: flex; flex-direction: column; align-items: center; }
#inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
.inv-item { background: rgba(40,0,0,0.7); border: 1px solid #5a0000; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; color: #f88; cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 5px #000; }
.inv-item:hover { background: rgba(80,0,0,0.9); border-color: #f00; color: #fff; }
.inv-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
#journal-list, #ach-list { width: 100%; max-width: 500px; text-align: left; margin-bottom: 20px; color: #bbb; max-height: 40vh; overflow-y: auto; padding-right: 5px; }
.journal-item, .ach-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
.journal-item b { color: #f44; font-size: 16px; text-shadow: 0 0 5px #f00; }
.ach-item.unlocked { color: #8f8; text-shadow: 0 0 5px #0f0; }

/* Экран старта */
#start-screen {
  position: fixed; inset: 0; background: #000; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at center, #1a0000 0%, #000 100%);
}
#start-screen h1 { color: #f00; font-size: 42px; text-shadow: 0 0 20px #f00, 0 0 10px #f00; margin-bottom: 40px; text-align: center; letter-spacing: 5px; }
#start-screen button {
  background: #400; border: 2px solid #f00; color: #fff;
  padding: 15px 50px; font-size: 22px; font-family: inherit; font-weight: bold;
  cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 2px;
  box-shadow: 0 0 20px rgba(255,0,0,0.4), inset 0 0 10px rgba(255,0,0,0.2); transition: 0.3s;
}
#start-screen button:hover { background: #800; box-shadow: 0 0 40px rgba(255,0,0,0.8), inset 0 0 20px rgba(255,0,0,0.4); transform: scale(1.05); }

@media (min-width: 769px) {
  #ui { padding: 20px 50px; min-height: 30vh; }
  #text-box { font-size: 20px; }
  .choice-btn { max-width: 600px; }
  #phone-ui { width: 400px; height: 70%; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <canvas id="darkness-mask"></canvas>
  <canvas id="weather"></canvas>
  <div id="fog"></div>
  <div id="vignette"></div>
  <div id="blood-overlay"></div>
  <div id="shake"></div>
  <div id="transition-text"></div>
  
  <div id="jumpscare"></div>

  <div id="phone-ui">
    <div id="phone-header">
        <span>Анонимный чат</span>
        <span id="phone-battery">🔋 100%</span>
    </div>
    <div id="phone-chat"></div>
  </div>

  <div id="end-screen">
      <h1>КОНЕЦ ДЕМОВЕРСИИ</h1>
      <p>Спасибо, что поиграли в нашу игру! Мы очень старались напугать вас. Продолжение следует...</p>
      <button onclick="startNewGame()">В главное меню</button>
  </div>

  <div id="top-hud">
    <div id="stats">
      <span class="stat-badge">❤️ <span id="hp">100</span></span>
      <span class="stat-badge">🧠 <span id="sanity">100</span></span>
      <span class="stat-badge">🔋 <span id="battery">100</span></span>
      <span class="stat-badge">⚡ <span id="stamina">100</span></span>
      <span class="stat-badge">🔊 <span id="noise">0</span></span>
      <span class="stat-badge">⚖️ <span id="karma">0</span></span>
      <span class="stat-badge">🎒 <span id="inv-count">0</span></span>
    </div>
    <div id="minimap-box">
      <span>🗺️ Карта:</span>
      <span id="minimap-loc">Комната</span>
    </div>
  </div>

  <div id="ui">
    <div id="text-box">Загрузка...</div>
    <div id="choices"></div>
  </div>

  <div id="touch-controls">
    <button onclick="togglePauseMenu()">☰<span>МЕНЮ</span></button>
    <button onclick="useFlashlight()">🔦<span>СВЕТ</span></button>
    <button onclick="useWeapon()">🔪<span>НОЖ</span></button>
  </div>

  <div id="flash"></div>
  <div id="notify"></div>
  
  <div id="fake-window">
    <p id="fake-window-text">Ты уверен?</p>
    <div class="btn-row">
      <button onclick="closeFakeWindow(true)">Да</button>
      <button onclick="closeFakeWindow(false)" id="fake-no-btn">Нет</button>
    </div>
  </div>

  <div id="menu-overlay">
    <h2 id="menu-title">ПАУЗА</h2>
    <div id="menu-content"></div>
  </div>

  <div id="start-screen">
    <h1>BLOOD HORROR</h1>
    <button onclick="startGame()">Войти во тьму</button>
  </div>
</div>

<script>
// ========== ИНИЦИАЛИЗАЦИЯ ЗВУКА ==========
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audio = {
  init() { if (audioCtx.state === 'suspended') audioCtx.resume(); },
  tone(freq, dur, type='sine', vol=0.1) {
    if (!soundOn) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(audioCtx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  },
  drip() { this.tone(800, 0.15, 'sine', 0.08); },
  creak() { this.tone(120, 0.6, 'sawtooth', 0.06); },
  scream() { this.tone(400, 0.8, 'sawtooth', 0.15); setTimeout(() => this.tone(300, 0.6, 'square', 0.1), 100); },
  heartbeat() { this.tone(60, 0.15, 'sine', 0.2); setTimeout(() => this.tone(50, 0.15, 'sine', 0.15), 200); },
  breath() { this.tone(100, 1.5, 'triangle', 0.05); },
  ambient() { 
    if (!soundOn) return;
    const theme = state.scene === 'basement' ? 45 : state.scene === 'corridor' ? 55 : 40;
    this.tone(theme, 4, 'sine', 0.02); 
    setTimeout(() => this.ambient(), 4000); 
  },
  pickup() { this.tone(600, 0.1, 'sine', 0.15); setTimeout(() => this.tone(900, 0.15, 'sine', 0.1), 80); },
  unlock() { this.tone(400, 0.1, 'square', 0.1); setTimeout(() => this.tone(600, 0.2, 'square', 0.1), 100); },
  echo() { this.tone(200, 0.4, 'sawtooth', 0.08); setTimeout(() => this.tone(180, 0.4, 'sawtooth', 0.06), 200); },
  hit() { this.tone(150, 0.2, 'square', 0.15); },
  victory() { this.tone(400, 0.2, 'sine', 0.1); setTimeout(() => this.tone(600, 0.2, 'sine', 0.1), 200); setTimeout(() => this.tone(800, 0.4, 'sine', 0.1), 400); },
  phoneVibrate() { this.tone(150, 0.1, 'square', 0.2); setTimeout(() => this.tone(150, 0.1, 'square', 0.2), 200); },
  noise() { this.tone(300, 0.05, 'sawtooth', 0.1); }
};

// ========== СОСТОЯНИЕ ==========
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const weatherCanvas = document.getElementById('weather');
const wctx = weatherCanvas.getContext('2d');
const darkCanvas = document.getElementById('darkness-mask');
const dctx = darkCanvas.getContext('2d');
const textBox = document.getElementById('text-box');
const choicesBox = document.getElementById('choices');
const menuOverlay = document.getElementById('menu-overlay');
const menuTitle = document.getElementById('menu-title');
const menuContent = document.getElementById('menu-content');
const transText = document.getElementById('transition-text');
const phoneUi = document.getElementById('phone-ui');
const phoneChat = document.getElementById('phone-chat');

let state = { 
  scene: 'start', hp: 100, paused: false, battery: 100, flashlightOn: false, stamina: 100, noise: 0,
  difficulty: 'normal', weaponDurability: 3, karma: 0, location: 'Комната', currentFloor: 1,
  endlessMode: false, endlessScore: 0, endlessWave: 1, speedrunMode: false, speedrunTime: 0, colorblind: false,
  savedSurvivor: false, phoneBattery: 100
};
let soundOn = true, typeSpeed = 25;
let drawInterval = null;
let gameLoopRunning = false;
let idleTimer = 0;
let isIdle = false;

function resize() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  darkCanvas.width = innerWidth; darkCanvas.height = innerHeight;
  weatherCanvas.width = innerWidth; weatherCanvas.height = innerHeight;
}
window.addEventListener('resize', resize); resize();

function notify(msg) {
  const n = document.getElementById('notify');
  n.textContent = msg; n.classList.add('active');
  setTimeout(() => n.classList.remove('active'), 2500);
  if (navigator.vibrate) navigator.vibrate(50);
}

// ========== СКРИМЕР ==========
let jumpscareActive = false;
function triggerJumpscare() {
    if (jumpscareActive) return;
    jumpscareActive = true;
    const js = document.getElementById('jumpscare');
    js.classList.add('active');
    audio.scream();
    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
    setTimeout(() => { js.classList.remove('active'); jumpscareActive = false; }, 500);
}

// ========== ФАЛЬШИВОЕ ОКНО ==========
function triggerFakeWindow() {
  const win = document.getElementById('fake-window');
  const txt = document.getElementById('fake-window-text');
  const noBtn = document.getElementById('fake-no-btn');
  
  const texts = ["Ты уверен, что хочешь продолжить?", "Оно смотрит на тебя", "Выйти из игры?", "Это не сон.", "Беги."];
  txt.textContent = texts[Math.floor(Math.random()*texts.length)];
  
  win.classList.add('active');
  audio.echo();
  
  noBtn.style.position = 'relative';
  noBtn.onmouseover = () => {
    noBtn.style.left = (Math.random() * 100 - 50) + 'px';
    noBtn.style.top = (Math.random() * 50 - 25) + 'px';
  };
}
function closeFakeWindow(wasYes) {
  document.getElementById('fake-window').classList.remove('active');
  document.getElementById('fake-no-btn').style.left = '0px';
  document.getElementById('fake-no-btn').style.top = '0px';
  
  if (wasYes) {
    sanity.decrease(15); triggerJumpscare();
    notify("Ты чувствуешь, как что-то коснулось твоей спины...");
  }
}

// ========== СЛУЧАЙНЫЕ СОБЫТИЯ ==========
const randomEvents = {
  trigger() {
    if (Math.random() > 0.2) return false;
    const events = [
      { text: "Свет мигает, ты слышишь шёпот за спиной...", type: 'scare' },
      { text: "На полу лежит окровавленный бинт. Ты подбираешь его.", type: 'item_bandage' },
      { text: "Из темноты доносится детский плач. Рассудок падает.", type: 'sanity' },
      { text: "Ты находишь старую батарейку. Заряд фонарика восстановлен.", type: 'battery' },
      { text: "Стены покрываются кровавыми надписями: 'БЕГИ'.", type: 'scare' },
      { text: "Система зависла... (Оно играет с тобой)", type: 'fake_window' }
    ];
    const ev = events[Math.floor(Math.random() * events.length)];
    if (ev.type === 'scare') { triggerJumpscare(); sanity.decrease(10); flash.trigger('#ff0000'); }
    if (ev.type === 'item_bandage') { inventory.add('бинт'); }
    if (ev.type === 'sanity') { audio.echo(); sanity.decrease(15); }
    if (ev.type === 'battery') { state.battery = Math.min(100, state.battery + 30); document.getElementById('battery').textContent = Math.floor(state.battery); }
    if (ev.type === 'fake_window') { setTimeout(triggerFakeWindow, 500); }
    notify("⚠️ " + ev.text);
    return true;
  }
};

// ========== КРОВЬ ==========
const gore = {
  particles: [], puddles: [],
  spawn(x, y, count=20) {
    for (let i=0;i<count;i++) this.particles.push({ x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10-2, life:60+Math.random()*40, size:2+Math.random()*5 });
  },
  addPuddle(x, y, r=40) { this.puddles.push({x, y, r, alpha:0.8}); },
  clear() { this.particles = []; this.puddles = []; },
  update() {
    this.particles = this.particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--; return p.life>0; });
  },
  draw() {
    this.puddles.forEach(p => { 
        ctx.fillStyle = `rgba(120,0,0,${p.alpha})`; 
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r*0.3, 0, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle = `rgba(200,50,50,${p.alpha * 0.5})`; ctx.beginPath(); ctx.ellipse(p.x - p.r*0.2, p.y - p.r*0.05, p.r*0.3, p.r*0.1, 0, 0, Math.PI*2); ctx.fill();
    });
    this.particles.forEach(p => { ctx.fillStyle = `rgba(200,0,0,${Math.min(1, p.life/60)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
  }
};

const flash = {
  trigger(color='#fff') { const f = document.getElementById('flash'); f.style.background = color; f.classList.add('active'); setTimeout(() => f.classList.remove('active'), 100); }
};

// ========== ПОГОДА ==========
const weather = {
  rainDrops: [],
  update() {
    if (state.location === 'Крыша' || state.scene === 'roof') {
      if (this.rainDrops.length < 200) this.rainDrops.push({x: Math.random()*innerWidth, y: 0, speed: 20+Math.random()*20});
      this.rainDrops.forEach((d, i) => { d.y += d.speed; if (d.y > innerHeight) this.rainDrops.splice(i, 1); });
    } else {
      this.rainDrops = [];
    }
    wctx.clearRect(0,0,innerWidth,innerHeight);
    wctx.strokeStyle = 'rgba(150,150,200,0.3)';
    wctx.lineWidth = 1.5;
    this.rainDrops.forEach(d => { wctx.beginPath(); wctx.moveTo(d.x, d.y); wctx.lineTo(d.x-5, d.y+25); wctx.stroke(); });
  }
};

// ========== СТАТЫ ==========
const sanity = {
  value: 100,
  set(v) {
    this.value = Math.max(0, Math.min(100, v));
    document.getElementById('sanity').textContent = this.value;
    const s = document.getElementById('shake');
    if (this.value < 40) document.body.style.filter = state.colorblind ? 'contrast(1.5)' : `hue-rotate(${(40-this.value)*3}deg)`;
    else document.body.style.filter = state.colorblind ? 'contrast(1.5)' : '';
    s.classList.toggle('active', this.value < 30);
  },
  decrease(n) { this.set(this.value - n); },
  increase(n) { this.set(this.value + n); }
};

const staminaSys = {
  value: 100,
  drain(n) { this.value = Math.max(0, this.value - n); document.getElementById('stamina').textContent = Math.floor(this.value); },
  regen() { if (this.value < 100) { this.value = Math.min(100, this.value + 0.2); document.getElementById('stamina').textContent = Math.floor(this.value); } }
};

const noiseSys = {
  value: 0,
  add(n) { this.value = Math.min(100, this.value + n); document.getElementById('noise').textContent = Math.floor(this.value); },
  reset() { this.value = 0; document.getElementById('noise').textContent = 0; }
};

const batterySystem = {
  drain() {
    if (!state.flashlightOn) return;
    state.battery = Math.max(0, state.battery - 0.05);
    document.getElementById('battery').textContent = Math.floor(state.battery);
    if (state.battery <= 0) { state.flashlightOn = false; notify('Фонарик сел'); }

};

const karma = { value: 0, add(n) { this.value += n; document.getElementById('karma').textContent = this.value; } };

function useFlashlight() { if(state.paused) return; state.flashlightOn = !state.flashlightOn; notify(state.flashlightOn ? 'Фонарик ВКЛ' : 'Фонарик ВЫКЛ'); }

function useWeapon() {
  if(state.paused) return;
  let weapon = inventory.has('топор') ? 'топор' : inventory.has('труба') ? 'труба' : inventory.has('нож') ? 'нож' : null;
  if (!weapon) { notify('Нет оружия'); return; }
  if (staminaSys.value < 20) { notify('Нет сил для удара!'); return; }
  staminaSys.drain(20); state.weaponDurability--; noiseSys.add(20);
  audio.hit(); notify(`Удар ${weapon}! Прочность: ${state.weaponDurability}`);
  if (state.weaponDurability <= 0) { notify('Оружие сломалось!'); inventory.remove(weapon); }

let enemyMultiplier = 1;
const enemy = {
  active: false, timer: 0,
  start(sec=30) { this.active=true; this.timer=sec/enemyMultiplier; },
  stop() { this.active=false; this.timer=0; },
  update(dt) {
    if (!this.active) return;
    this.timer -= dt;
    if (this.timer <= 0) { this.active=false; this.onCatch(); }
    else if (this.timer < 10 && Math.random() < 0.05) audio.heartbeat();
  },
  onCatch() {
    if (['part2_phone', 'part2_choice', 'part3_server'].includes(state.scene)) {
        this.stop(); return; 
    }
    flash.trigger('#ff0000'); triggerJumpscare();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    sanity.decrease(30); state.hp -= 40;
    document.getElementById('hp').textContent = Math.max(0, state.hp);
    stats.deaths++; saveGame();
    goTo(state.hp <= 0 ? 'death' : 'caught');
  }
};

const echo = {
  active: false, timer: null, messages: ['обернись','я здесь','не отвечай', 'это не твой голос'],
  start() { this.active = true; this.tick(); },
  stop() { this.active = false; clearTimeout(this.timer); },
  tick() {
    if (!this.active) return;

    this.timer = setTimeout(() => this.tick(), 8000);

};

function showText(t) { 
  if (sanity.value < 50 && Math.random() < 0.3) {
    const words = t.split(' ');
    const insertIndex = Math.floor(Math.random() * words.length);
    words.splice(insertIndex, 0, '<span style="color:#f00; font-weight:bold; text-shadow:0 0 5px #f00;">ОБЕРНИСЬ.</span>');
    t = words.join(' ');
    
    clearInterval(typewriter.timer); textBox.innerHTML = ''; let i = 0;
    typewriter.timer = setInterval(() => {
      if (i < t.length) {
          if (t[i] === '<') { const end = t.indexOf('>', i); textBox.innerHTML += t.substring(i, end + 1); i = end + 1; } 
          else { textBox.innerHTML += t[i]; i++; }
      } else { clearInterval(typewriter.timer); }
    }, typeSpeed);
  } else { typewriter.write(t); }
}

// ========== УЛУЧШЕННАЯ ГРАФИКА ==========
function renderBackground(sceneId) {
  if (drawInterval) clearInterval(drawInterval);
  
  const colors = { 
    start: '#2a2520', look_around: '#2a2520', corner: '#3a1010', door: '#1a1a22', 
    corridor: '#101015', basement: '#200808', floor2: '#1a1a20', roof: '#0a0d18', 
    default: '#151515', endless: '#250000',
    part2: '#1a1a25',
    part3_server: '#001100'
  };
  const bgCol = colors[sceneId] || colors.default;

  const drawFrame = () => {
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, canvas.width, canvas.height);

    const floorY = canvas.height * 0.6;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 2;
    for (let i = -canvas.width; i < canvas.width * 2; i += 60) {
      ctx.beginPath(); ctx.moveTo(canvas.width/2 + i * 0.2, floorY); ctx.lineTo(canvas.width/2 + i * 1.5, canvas.height); ctx.stroke();
    }
    for (let i = 1; i <= 5; i++) { let y = floorY + (canvas.height - floorY) * (i/5); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

    const wallTop = canvas.height * 0.3;
    const wallBottom = floorY;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(canvas.width * 0.2, wallTop); ctx.lineTo(canvas.width * 0.2, wallBottom); ctx.lineTo(0, floorY); ctx.fill();
    ctx.beginPath(); ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width * 0.8, wallTop); ctx.lineTo(canvas.width * 0.8, wallBottom); ctx.lineTo(canvas.width, floorY); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(canvas.width * 0.2, wallTop, canvas.width * 0.6, wallBottom - wallTop);
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let x = canvas.width * 0.2; x < canvas.width * 0.8; x += 40) {
        for (let y = wallTop; y < wallBottom; y += 40) { ctx.beginPath(); ctx.arc(x + 20, y + 20, 5, 0, Math.PI*2); ctx.fill(); }
    }

    if (sceneId === 'part3_server') {
        for (let i = 0; i < 3; i++) {
            let sx = canvas.width * 0.2 + i * (canvas.width * 0.2);
            ctx.fillStyle = '#111'; ctx.fillRect(sx, wallTop + 20, canvas.width * 0.15, wallBottom - wallTop - 20);
            for (let j = 0; j < 20; j++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#0f0' : '#f00';
                ctx.fillRect(sx + 10, wallTop + 40 + j * 15, 5, 5);
            }
        }
    } else if (sceneId === 'start' || sceneId === 'look_around') {
        const wx = canvas.width * 0.7, wy = wallTop + 40, ww = canvas.width * 0.15, wh = canvas.height * 0.2;
        ctx.fillStyle = '#050a15'; ctx.fillRect(wx, wy, ww, wh);
        ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.arc(wx + ww*0.7, wy + wh*0.3, 15, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#222'; ctx.lineWidth = 6; ctx.strokeRect(wx, wy, ww, wh);
        ctx.beginPath(); ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(wx, wy + wh/2); ctx.lineTo(wx + ww, wy + wh/2); ctx.stroke();
        const dx = canvas.width * 0.4, dy = wallTop + 20, dw = canvas.width * 0.2, dh = wallBottom - dy;
        ctx.fillStyle = '#2a1a10'; ctx.fillRect(dx, dy, dw, dh);
        ctx.strokeStyle = '#150a05'; ctx.lineWidth = 3; ctx.strokeRect(dx + 10, dy + 10, dw - 20, dh*0.4); ctx.strokeRect(dx + 10, dy + dh*0.5, dw - 20, dh*0.4);
        ctx.fillStyle = '#8a7a5a'; ctx.beginPath(); ctx.arc(dx + dw - 15, dy + dh*0.5, 6, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke();
    } 
    else if (sceneId === 'part2') {
        const wx = canvas.width * 0.2, wy = wallTop + 50, ww = canvas.width * 0.2, wh = canvas.height * 0.25;
        ctx.fillStyle = '#222'; ctx.fillRect(wx, wy, ww, wh);
        for (let i = 0; i < wh; i += 10) { ctx.fillStyle = i % 20 === 0 ? '#111' : '#333'; ctx.fillRect(wx, wy + i, ww, 5); }
        const bx = canvas.width * 0.5, by = wallBottom - 60, bw = canvas.width * 0.3, bh = 80;
        ctx.fillStyle = '#111'; ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#300'; ctx.fillRect(bx + 10, by + 10, bw - 20, bh - 20);
        ctx.fillStyle = '#fff'; ctx.fillRect(bx + 10, by - 10, 40, 20);
    }
    else if (sceneId === 'corridor') {
        if (Math.random() > 0.1) {
            const lightGrad = ctx.createRadialGradient(canvas.width/2, wallTop, 10, canvas.width/2, wallTop, canvas.width*0.5);
            lightGrad.addColorStop(0, 'rgba(200,200,150,0.4)'); lightGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = lightGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.fillStyle = 'rgba(100,0,0,0.6)';
        for(let i=0; i<5; i++) { let sx = canvas.width * 0.2 + Math.random() * canvas.width * 0.6; let sy = wallTop + Math.random() * 50; ctx.fillRect(sx, sy, 2 + Math.random()*3, 50 + Math.random()*100); ctx.beginPath(); ctx.arc(sx+2, sy, 4, 0, Math.PI*2); ctx.fill(); }
    } else if (sceneId === 'basement') {
        ctx.strokeStyle = '#333'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(0, wallTop+20); ctx.lineTo(canvas.width, wallTop+20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(canvas.width * 0.3, 0); ctx.lineTo(canvas.width * 0.3, wallTop+20); ctx.stroke();
        ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(canvas.width * 0.3, wallTop+20, 15, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#700'; ctx.beginPath(); ctx.arc(canvas.width * 0.6, wallTop+25, 3, 0, Math.PI*2); ctx.fill(); ctx.fillRect(canvas.width * 0.6 - 1, wallTop+25, 2, 80);
    } else if (sceneId === 'floor2') {
        const cx = canvas.width * 0.65, cy = wallBottom - 40, cw = canvas.width * 0.2, ch = 60;
        ctx.strokeStyle = '#332211'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx, cy+ch); ctx.lineTo(cx+10, cy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx+cw, cy+ch); ctx.lineTo(cx+cw-10, cy); ctx.stroke();
        ctx.strokeRect(cx+5, cy, cw-10, 30); ctx.fillStyle = '#600'; ctx.fillRect(cx+10, cy+5, cw-20, 20);
        for (let i=10; i<cw-10; i+=15) { ctx.beginPath(); ctx.moveTo(cx+i, cy); ctx.lineTo(cx+i, cy-30); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(cx+5, cy-30); ctx.lineTo(cx+cw-5, cy-30); ctx.stroke();
    } else if (sceneId === 'roof') {
        ctx.fillStyle = '#020205'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
        ctx.fillStyle = 'rgba(255, 200, 100, 0.4)'; for(let i=0; i<30; i++) { ctx.fillRect(Math.random() * canvas.width, floorY + Math.random() * (canvas.height - floorY), 3, 3); }
        ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i, floorY); ctx.lineTo(i, canvas.height); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(0, floorY+50); ctx.lineTo(canvas.width, floorY+50); ctx.stroke();
    } else {
        const dx = canvas.width * 0.4, dy = wallTop + 20, dw = canvas.width * 0.2, dh = wallBottom - dy;
        ctx.fillStyle = '#2a1a10'; ctx.fillRect(dx, dy, dw, dh); ctx.strokeStyle = '#150a05'; ctx.lineWidth = 3;
        ctx.strokeRect(dx + 10, dy + 10, dw - 20, dh*0.4); ctx.strokeRect(dx + 10, dy + dh*0.5, dw - 20, dh*0.4);
    }

    gore.draw();

    dctx.clearRect(0, 0, darkCanvas.width, darkCanvas.height);
    let baseDarkness = 0.65; 
    if (['start', 'safe', 'part2', 'part3_server'].includes(sceneId)) baseDarkness = 0.3; 
    
    dctx.fillStyle = `rgba(0,0,0,${baseDarkness})`; dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height);
    
    if (state.flashlightOn) {
      const cx = darkCanvas.width / 2, cy = darkCanvas.height / 2;
      const grad = dctx.createRadialGradient(cx, cy, 50, cx, cy, Math.max(canvas.width, canvas.height) * 0.6);
      grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.4, 'rgba(0,0,0,0.3)'); grad.addColorStop(1, `rgba(0,0,0,${baseDarkness})`);
      dctx.globalCompositeOperation = 'destination-out'; dctx.fillStyle = grad;
      dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height); dctx.globalCompositeOperation = 'source-over';
    }
    
    weather.update();
  };
  drawFrame(); drawInterval = setInterval(drawFrame, 33);
}

// Переход с анимацией и шансом на событие
function goTo(name) { 
    if (scenes[name]) { 
        state.scene = name; 
        enemy.stop(); 
        echo.stop();
        noiseSys.reset();

        const locNames = { start: 'Комната', look_around: 'Угол', corner: 'Тело', door: 'Дверь', corridor: 'Коридор', basement: 'Подвал', floor2: '2 Этаж', roof: 'Крыша', boss: 'Финал', endless: 'Кошмар', library: 'Библиотека', survivor_camp: 'Лагерь', part2: 'Квартира', part2_phone: 'Телефон', part2_choice: 'Диалог', part3_enter: 'Подвал (Спуск)', part3_server: 'Серверная' };
        if (locNames[name]) {
            transText.textContent = locNames[name]; transText.classList.add('show');
            setTimeout(() => transText.classList.remove('show'), 1000);
        }
        scenes[name](); 
        if (name !== 'part2_phone' && name !== 'part2_choice') {
            randomEvents.trigger(); 
        }
        save.save(); 
    } 
}

            showText('Ты бьешь по серверам. Искры, крики. Экран гаснет. Ты чувствуешь, как тьма отступает. Ты спасся.');
            setTimeout(() => {
                // ПОКАЗЫВАЕМ ЭКРАН КОНЦА ДЕМО
                document.getElementById('end-screen').classList.add('active');
                achievements.unlock('demo_end');
            }, 3000);
        }},
        { label: 'Посмотреть на экран', action: () => {
            showText('На экране ты видишь себя. Но это не ты. Это Эхо. Оно улыбается и говорит: "Добро пожаловать домой".');
            showChoices([{ label: 'Начать заново', action: () => startNewGame() }]);
        }}
    ]);
  }
};

// Функция проверки кода
function checkCode(btn) {
    const correct = 'Б'; // Правильный ответ - Б
    if (btn === correct) {
        audio.unlock();
        showText('Замок щелкает! Дверь открывается.');
        goTo('part3_server');
    } else {
        noiseSys.add(40);
        audio.noise();
        notify('Неверно! Шум усиливается.');
        if (noiseSys.value >= 80) {
            triggerJumpscare();
            state.hp -= 50;
            document.getElementById('hp').textContent = Math.max(0, state.hp);
            if (state.hp <= 0) {
                showText('Оно нашло тебя по шуму...');
                setTimeout(() => startNewGame(), 2000);
            } else {
                noiseSys.reset();
                goTo('part3_enter');
            }
        } else {
            goTo('part3_enter');
        }
    }
}

// ========== ЦИКЛ ==========
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (!state.paused && gameLoopRunning) {
    gore.update();
    enemy.update(dt); 
    batterySystem.drain();
    staminaSys.regen();
    updateBloodOverlay();
    noiseSys.value = Math.max(0, noiseSys.value - 0.5); // Шум спадает
    document.getElementById('noise').textContent = Math.floor(noiseSys.value);

    if (document.getElementById('fake-window').classList.contains('active')) {
       // Таймер стоит
    } else if (!enemy.active) {
       idleTimer += dt;
       if (idleTimer > 15 && !isIdle) {
           isIdle = true;
           audio.breath();
           notify("Ты слышишь тяжелое дыхание за спиной...");
           darkCanvas.style.opacity = 1; 
           setTimeout(() => darkCanvas.style.opacity = 0, 2000);
           sanity.decrease(5);
       }
    }
  }
  requestAnimationFrame(loop);
}

// ========== ЗАПУСК ==========
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  audio.init();
  gameLoopRunning = true;
  requestAnimationFrame(loop);
  goTo('start');
  audio.ambient();
}
</script>
